[package]
name = "boson-valence-identity"
version = "0.1.0"
edition = "2021"
description = "Valence ExecutionContextFactory for Boson task handlers"
license = "MIT"
repository = "https://github.com/unified-field-dev/boson-valence-identity"
publish = false

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[dependencies]
boson-core = { git = "https://github.com/unified-field-dev/boson", tag = "v0.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
valence = { package = "uf-valence", git = "https://github.com/unified-field-dev/valence", tag = "v0.1.2", default-features = false, features = ["mem"] }

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
